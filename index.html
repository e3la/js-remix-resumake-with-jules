<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumake - Free Online Resume Builder</title>
  <meta name="description" content="Generate elegant LaTeX and HTML resumes directly in your browser with zero backend requirements. Free and open source.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2pdf.js for Client-Side PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Navbar Header -->
    <header class="app-header">
      <div class="brand">
        <button id="toggle-editor-btn" class="btn btn-secondary mobile-toggle" title="Toggle Form Editor">
          <i class="fas fa-edit"></i>
        </button>
        <span>resu<span class="brand-accent">make</span></span>
      </div>

      <div class="header-controls">
        <div class="template-selector">
          <label for="template-select"><i class="fas fa-palette"></i> Template:</label>
          <select id="template-select" class="select-input">
            <option value="modern">Modern</option>
            <option value="classic">Classic</option>
            <option value="minimal">Minimal</option>
            <option value="compact">Compact</option>
          </select>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-regenerate" class="btn btn-secondary btn-sm" title="Force Regenerate Preview">
          <i class="fas fa-sync-alt"></i> Regenerate
        </button>
        <button id="btn-sample-data" class="btn btn-secondary btn-sm" title="Load Sample Data">
          <i class="fas fa-magic"></i> Sample
        </button>
        <button id="btn-clear-form" class="btn btn-secondary btn-sm" title="Clear Form">
          <i class="fas fa-eraser"></i> Clear
        </button>
        <button id="btn-export-json" class="btn btn-secondary btn-sm" title="Export JSONResume">
          <i class="fas fa-download"></i> JSON
        </button>
        <button id="btn-import-json" class="btn btn-secondary btn-sm" title="Import JSONResume">
          <i class="fas fa-upload"></i> Import
        </button>
        <input type="file" id="json-file-input" accept=".json" style="display: none;">

        <button id="btn-view-latex" class="btn btn-secondary btn-sm">
          <i class="fas fa-code"></i> LaTeX
        </button>
        <button id="btn-print-view" class="btn btn-secondary btn-sm" title="Open Standalone Printable Page for Browser Print Tools">
          <i class="fas fa-print"></i> Print / Page Setup
        </button>
        <button id="btn-download-pdf" class="btn btn-primary btn-sm">
          <i class="fas fa-file-pdf"></i> Download PDF
        </button>
      </div>
    </header>

    <!-- App Main Area -->
    <main class="app-main">
      <!-- Editor Sidebar -->
      <aside class="editor-sidebar">
        <div class="editor-content" id="editor-form-container">
          <!-- Dynamic Form Inputs Injected by app.js -->
        </div>
      </aside>

      <!-- Live Resume Preview Area -->
      <section class="preview-container">
        <div class="resume-paper" id="resume-preview">
          <!-- Rendered Resume Preview HTML -->
        </div>
      </section>
    </main>
  </div>

  <!-- LaTeX Source Code Modal -->
  <div class="modal-overlay" id="latex-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fas fa-code"></i> LaTeX Source Code</h3>
        <button class="btn-icon" id="close-latex-modal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <textarea id="latex-code" class="code-textarea" readonly></textarea>
      </div>
      <div class="modal-footer">
        <button id="copy-latex-btn" class="btn btn-secondary">
          <i class="fas fa-copy"></i> Copy Code
        </button>
        <button id="download-latex-btn" class="btn btn-primary">
          <i class="fas fa-file-download"></i> Download .tex
        </button>
      </div>
    </div>
  </div>

  <!-- Application JavaScript Files -->
  <script src="js/sample-data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/latex-generator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
